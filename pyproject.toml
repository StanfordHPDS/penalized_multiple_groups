readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "db-dtypes>=1.4.3",
    "fairlearn>=0.13.0",
    "google-cloud-bigquery-storage>=2.32.0",
    "google-cloud-bigquery[pandas]>=3.33.0",
    "great-tables>=0.20.0",
    "ipython>=9.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "tableone>=0.9.5",
    "tabulate>=0.9.0",
]
